[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "briefwright"
version = "0.1.0"
description = "A LangGraph research crew that plans, retrieves, analyzes, drafts, and critiques cited briefs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ashwath Bajaj", email = "255639596+AshwathBajaj@users.noreply.github.com" }]
keywords = ["langgraph", "rag", "agents", "guardrails", "llm"]
dependencies = [
  "langgraph>=1.0,<2",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "streamlit>=1.40",
]

[project.optional-dependencies]
embed = ["fastembed>=0.4,<1"]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "fpdf2>=2.8",
  "markdown>=3.7",
]

[project.scripts]
briefwright = "briefwright.cli:main"

[project.urls]
Homepage = "https://github.com/AshwathBajaj/multi-agent-langgraph"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
briefwright = ["py.typed", "corpus/sample/*", "eval/*.json"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/briefwright/api/app.py" = ["BLE001"]
"src/briefwright/ui/streamlit_app.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["briefwright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
